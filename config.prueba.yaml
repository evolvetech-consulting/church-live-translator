# =============================================================
#  Configuracion de PRUEBA para la PC de la iglesia.
#
#      .venv\Scripts\python main.py -c config.prueba.yaml
#
#  Entrada: el canal del microfono del predicador, por USB desde
#  el mixer. Salida: los auriculares o parlantes de la PC.
#
#  >>> NO TOCA EL SONIDO DE LA SALA. <<<
#  La traduccion NO sale por el mixer ni por los transmisores.
#  Sirve para mirar la transcripcion en el panel durante un culto
#  real, sin riesgo de que se escuche algo donde no debe.
#
#  Cuando esto funcione, se pasa a config.yaml, que si rutea al
#  transmisor.
# =============================================================

entrada:
  # Placa USB del mixer Behringer. Alcanza con una parte del nombre.
  dispositivo: "IN 1-8"
  frecuencia: 48000
  # Canal del microfono del predicador. Confirmado con tools/canales.py:
  # es el unico mono con señal mientras se predica. Si cambia el ruteo del
  # mixer, volver a correr:
  #   .venv\Scripts\python -m tools.canales -d "IN 1-8"
  canal: 7
  # Medido en un culto real: con x2 el pico queda en -20 dB y el promedio en
  # -38 dB, y el detector reconoce el 34% del audio como voz. Anda bien. Si
  # cambia el nivel del direct out en la consola, se ajusta desde el panel.
  ganancia: 2.0

vad:
  motor: "silero"
  # 0.35 es mas sensible que el valor por defecto (0.5). Con la señal del
  # mixer a -20 dB probablemente 0.5 tambien ande; si engancha ruido de sala,
  # subirlo.
  umbral: 0.35
  silencio_fin_ms: 700
  silencio_largo_ms: 1600
  min_frase_s: 3.0
  min_voz_ms: 400
  max_frase_s: 14.0
  pre_roll_ms: 300

stt:
  # La GPU de esta PC funciona (cuda/float16), asi que conviene probar un
  # modelo mas grande: es donde esta la mejora de calidad que falta, sobre
  # todo en nombres propios biblicos.
  #   small     -> rapido, lo que se probo el 12/09
  #   medium    -> mejor, ~1.5 GB de descarga
  #   large-v3  -> el mejor, ~3 GB de descarga
  modelo: "small"
  idioma: "es"
  dispositivo: "auto"
  tipo_computo: "auto"
  contexto_inicial: ""

traduccion:
  proveedor: "gemini"
  modelo: "gemini-2.5-flash"
  frases_contexto: 4
  timeout_s: 6.0

salidas:
  - idioma: "en"
    nombre: "Ingles"
    # null = la salida por defecto de Windows (auriculares/parlantes de la PC).
    # A proposito: durante la prueba la traduccion NO tiene que llegar ni al
    # mixer ni a los transmisores.
    dispositivo: null
    canal: 0
    voz: "en_US-lessac-medium"
    velocidad: 1.0
    ganancia: 0.8

latencia:
  umbral_aceleracion_s: 4.0
  umbral_maximo_s: 12.0
  velocidad_maxima: 1.25
  descartar_sobre_s: 25.0

web:
  activo: true
  puerto: 8080

registro:
  carpeta: "registros"
