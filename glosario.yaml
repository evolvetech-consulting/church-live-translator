# =============================================================
#  Glosario de la iglesia
#
#  Este archivo es lo que mas mueve la aguja en la calidad. Se usa
#  en dos lugares:
#
#   1. Whisper lo recibe como "contexto inicial", lo que sesga el
#      reconocimiento hacia estas palabras. Es lo que evita que
#      "Efesios" salga como "efectos".
#   2. Claude lo recibe en el prompt, para traducir con el termino
#      que usa esta congregacion y no el generico del diccionario.
#
#  Conviene revisarlo despues de los primeros cultos: en la carpeta
#  registros/ queda todo lo que se dijo y como se tradujo.
# =============================================================

# Nombres propios que se dicen seguido. Sin esto Whisper los destroza.
# ESTOS SON DE EJEMPLO: reemplazalos por los de tu congregacion (el nombre
# de la iglesia, los pastores, los lideres que se nombran seguido).
nombres:
  - Pastor Marcelo
  - Iglesia Cristiana
  # Nombres de Dios: Whisper los destroza sin esto ("Dejiova" por "Jehova").
  - Jehová
  - Jesucristo
  - Cristo

# Terminos que SIEMPRE se traducen de una manera determinada.
# Formato:  termino en español: traduccion por idioma
terminos:
  ofrenda:
    en: offering
  diezmo:
    en: tithe
  alabanza:
    en: worship
  culto:
    en: service
  célula:
    en: small group
  discipulado:
    en: discipleship
  hermano:
    en: brother
  hermana:
    en: sister
  congregación:
    en: congregation
  ancianos:
    en: elders
  arrepentimiento:
    en: repentance
  salvación:
    en: salvation
  Espíritu Santo:
    en: Holy Spirit
  misericordia:
    en: mercy
  testimonio:
    en: testimony
  primicias:
    en: firstfruits
  rincón infantil:
    en: children's corner
  santa cena:
    en: the Lord's Supper
  avivamiento:
    en: revival
  célula:
    en: small group
  pacto:
    en: covenant

# Vocabulario con el que sesgar el RECONOCIMIENTO de voz (no la traduccion).
#
# >>> Whisper solo acepta unos 223 tokens de contexto: entran alrededor de
#     60 terminos contando tambien `nombres` y `terminos`. Si te pasas, el
#     sistema avisa al arrancar y te dice cuales quedaron afuera. <<<
#
# Por eso conviene poner SOLO lo que el reconocimiento falla de verdad:
# nombres propios raros y palabras que no son del castellano corriente.
# Las palabras comunes ("fe", "gracia", "oracion", "evangelio") Whisper las
# acierta solo, y ocupan lugar que necesitan las dificiles.
#
# Escribi todo CON TILDES: Whisper imita la ortografia del contexto que
# recibe, asi que un glosario sin tildes le hace devolver el texto sin tildes.
#
# Como saber cuales agregar: revisa registros/ despues de cada culto y busca
# las que salieron mal. En un culto real aparecieron "Sehon" como "cejon" y
# "Horeb" como "error": esas son las que valen.
vocabulario:
  # Libros que el reconocimiento confunde (los faciles como Juan o Marcos no
  # hacen falta).
  - Deuteronomio
  - Levítico
  - Crónicas
  - Eclesiastés
  - Lamentaciones
  - Ezequiel
  - Abdías
  - Miqueas
  - Nahúm
  - Habacuc
  - Sofonías
  - Hageo
  - Malaquías
  - Efesios
  - Filipenses
  - Colosenses
  - Tesalonicenses
  - Filemón
  - Apocalipsis

  # Nombres y lugares biblicos que no son palabras del castellano corriente.
  - Sehón
  - Og
  - Basán
  - Horeb
  - Sinaí
  - Canaán
  - Nazaret
  - amorreos
  - filisteos
  - fariseos
  - saduceos
  - Eliseo
  - Matusalén

  # Vocabulario de predicacion que suele salir mal.
  - versículo
  - jornadas
  - primicias
  - intercesión
  - avivamiento
  - consagración
  - misericordioso
  - rincón infantil
  # Estas estan tambien en `terminos` (para fijar la traduccion), pero se
  # repiten aca porque el reconocimiento tambien las falla: "ofrenda" salio
  # como "ofenda" en una prueba real.
  - ofrenda
  - diezmo
  - alabanza
  - congregación
  - arrepentimiento
  - Espíritu Santo
  - misericordia


# Instrucciones libres para el traductor. Aca va todo lo que no entra
# en una lista de terminos.
notas: |
  - Registro hablado y calido, como un predicador dirigiendose a su
    congregacion. No academico, no formal de escritura.
  - Las citas biblicas se traducen con la redaccion habitual de las
    traducciones al ingles mas usadas (NIV / ESV), no palabra por palabra
    desde el español.
  - "Hermanos" dicho a la congregacion entera se traduce "brothers and
    sisters", no "brothers".
