# =============================================================
#  Traductor automatico de culto
#  Correr `python -m tools.dispositivos` para ver los nombres
#  exactos de las placas de audio de esta computadora.
# =============================================================

entrada:
  # Placa USB del mixer Behringer. Alcanza con una parte del nombre.
  dispositivo: "IN 1-8"
  # Frecuencia a la que abrimos la placa. 48000 es lo que soporta casi todo.
  # Internamente remuestreamos a 16 kHz para Whisper.
  frecuencia: 48000
  # Canal del microfono del predicador. Confirmado con tools/canales.py en la
  # iglesia: es el unico mono con señal mientras se predica. Si cambia el
  # ruteo del mixer, volver a correr:
  #   .venv\Scripts\python -m tools.canales -d "IN 1-8"
  canal: 7
  # Medido en un culto real: con x2 el pico queda en -20 dB y el promedio en
  # -38 dB, y el detector reconoce el 34% del audio como voz. Anda bien. Si
  # cambia el nivel del direct out en la consola, se ajusta desde el panel.
  ganancia: 2.0

# -------------------------------------------------------------
# Deteccion de voz: define DONDE se corta cada frase.
# Es la pieza que mas afecta la latencia percibida.
# -------------------------------------------------------------
vad:
  # silero = red neuronal, robusta si se filtra musica o ruido de sala (default).
  # energia = umbral de volumen adaptativo, mas liviano y predecible.
  motor: "silero"
  # 0..1. Subirlo si engancha ruido; bajarlo si se come palabras.
  umbral: 0.5
  # Cortar en las pausas del orador, pero no en cualquiera: un predicador
  # hace pausas cortas EN MEDIO de la oracion, y cortar ahi manda a traducir
  # pedazos sueltos que por separado no significan nada.
  #
  #   silencio_fin_ms   -> cierra la frase si ya tiene cuerpo (min_frase_s)
  #   silencio_largo_ms -> cierra siempre: aca el orador termino de verdad
  #   min_frase_s       -> por debajo de esto seguimos acumulando
  #
  # Subir min_frase_s da mejores traducciones pero mas latencia. Bajarlo
  # responde antes y fragmenta mas.
  silencio_fin_ms: 700
  silencio_largo_ms: 1600
  min_frase_s: 3.0
  # Ignorar "frases" mas cortas que esto (toses, golpes de micro).
  min_voz_ms: 400
  # Corte forzado: si alguien habla sin pausas, no esperamos para siempre.
  # El corte busca el punto mas silencioso reciente para no partir una palabra.
  max_frase_s: 14.0
  # Audio previo al inicio detectado que igual mandamos (no comerse la
  # primera silaba).
  pre_roll_ms: 300
stt:
  # tiny | base | small | medium | large-v3
  # small = buen equilibrio en CPU. medium = notablemente mejor si hay GPU
  # o un Apple Silicon con aire.
  modelo: "small"
  idioma: "es"
  dispositivo: "auto"        # auto | cpu | cuda
  tipo_computo: "auto"       # auto | int8 | int8_float16 | float16
  # Sesga el reconocimiento hacia el vocabulario de la iglesia.
  # Se arma solo a partir de glosario.yaml, esto se le suma.
  contexto_inicial: ""

# -------------------------------------------------------------
# Traduccion
# -------------------------------------------------------------
traduccion:
  # claude | gemini | local
  #   claude / gemini -> calidad alta, ~centavos por culto, necesita internet
  #   local           -> gratis y offline, calidad menor (es el mismo fallback
  #                      automatico que se usa si se cae la conexion)
  #
  # La clave va en .env:  GEMINI_API_KEY=...  o  ANTHROPIC_API_KEY=...
  # Verificar con:  .venv/bin/python -m tools.probar_traduccion
  proveedor: "gemini"

  # gemini -> gemini-2.5-flash (rapido y barato) | gemini-2.5-pro (mejor)
  # claude -> claude-haiku-4-5 (rapido y barato) | claude-sonnet-5 (mejor)
  modelo: "gemini-2.5-flash"

  # Cuantas frases anteriores mandamos como contexto. Da coherencia en
  # pronombres y en el hilo del sermon. Mas contexto = un poco mas lento.
  frases_contexto: 4

  # Si el proveedor tarda mas que esto, se usa el fallback y se sigue.
  timeout_s: 6.0
# -------------------------------------------------------------
# Un canal fisico por idioma ACTIVO. Dos idiomas activos NO pueden
# compartir canal: se pisarian el audio (el programa lo rechaza).
#
# >>> ANTES DE USAR EN VIVO <<<
# El nombre "X-USB" de mas abajo es el que se espera para la salida del
# mixer, pero todavia no se confirmo en la iglesia (solo se confirmo la
# ENTRADA, "IN 1-8"). Correr en la PC de la iglesia:
#     .venv\Scripts\python -m tools.dispositivos
# y poner el nombre exacto que aparezca ahi para la salida del X-USB, con
# al menos 4 canales. En la consola, verificar tambien que esos 4 retornos
# USB NO esten en la mezcla principal, o la sala escucha las traducciones.
#
# No todos los cultos necesitan los cuatro idiomas: con `activo: false` uno
# queda configurado (placa, voz, canal) pero no se le pide traduccion ni se
# sintetiza audio para el, asi que apagarlo ahorra de verdad. Se prende y
# apaga en caliente desde el panel; no hace falta tocar esto a mano salvo
# que quieras dejar alguno apagado por defecto.
#
# Un idioma apagado no ocupa su canal de verdad: otro activo se puede mudar
# ahi sin problema desde el panel. Si despues queres reactivarlo, primero
# hay que darle un canal libre, o el programa avisa que choca con el que
# esta sonando.
# -------------------------------------------------------------
salidas:
  - idioma: "en"
    nombre: "Ingles"
    dispositivo: "X-USB"
    canal: 0
    voz: "en_US-lessac-medium"
    velocidad: 1.0
    ganancia: 0.8
    # Variabilidad de la voz. Dejar sin definir usa los valores propios de la
    # voz, que es lo recomendado. Subirlo alarga las frases hasta un 25% y
    # mueve poco el tono: lo que de verdad define la entonacion es la
    # puntuacion del texto, que el traductor ya decide segun el sentido.
    # expresividad: 1.0
    activo: true

  - idioma: "pt"
    nombre: "Portugues"
    dispositivo: "X-USB"
    canal: 1
    voz: "pt_BR-faber-medium"
    velocidad: 1.0
    ganancia: 0.8
    activo: true

  - idioma: "fr"
    nombre: "Frances"
    dispositivo: "X-USB"
    canal: 2
    voz: "fr_FR-siwis-medium"
    velocidad: 1.0
    ganancia: 0.8
    activo: true

  - idioma: "uk"
    nombre: "Ucraniano"
    dispositivo: "X-USB"
    canal: 3
    # Unica voz ucraniana de calidad media; las otras son x_low o high (~1s
    # mas de latencia cada una). Ver README -> Varios idiomas.
    voz: "uk_UA-ukrainian_tts-medium"
    velocidad: 1.0
    ganancia: 0.8
    activo: true

# -------------------------------------------------------------
# Control de latencia acumulada.
#
# El problema: si el predicador no para de hablar, la cola de audio
# por traducir crece y a los 20 minutos estas 40 segundos atras.
# Solucion: acelerar la sintesis cuando la cola crece.
# -------------------------------------------------------------
latencia:
  # A partir de esta cola pendiente (segundos) empezamos a acelerar.
  umbral_aceleracion_s: 4.0
  # Cola a la que se llega a la velocidad maxima.
  umbral_maximo_s: 12.0
  # Velocidad maxima de habla. 1.25 todavia se entiende bien; mas ya cansa.
  velocidad_maxima: 1.25
  # Si la cola supera esto, descartamos lo mas viejo: preferimos estar
  # sincronizados a decirlo todo.
  descartar_sobre_s: 25.0

# -------------------------------------------------------------
# Interfaz web. Dos paginas sobre el mismo servidor:
#
#   /            panel del operador: niveles, atraso por idioma,
#                transcripcion en vivo y tiempos de proceso.
#   /subtitulos  vista para la congregacion, la del codigo QR.
#
# Los subtitulos no cuestan nada extra (el texto ya lo tenemos) y
# sirven para personas sordas, para quien no alcanzo un receptor,
# y como respaldo si falla un transmisor.
# -------------------------------------------------------------
web:
  activo: true
  puerto: 8080

registro:
  # Guarda transcripcion + traduccion de cada culto para revisar despues
  # y para ir mejorando el glosario.
  carpeta: "registros"
